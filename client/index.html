<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/icon-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo/icon-white.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F7F4" />
    <meta name="description" content="Depuis 2017, AtooPV accompagne les CSE, CSSCT et IRP dans la rédaction de leurs procès-verbaux. Nos experts interviennent en présentiel ou à distance pour produire des PV conformes, précis et opposables." />
    <!-- Static default for the "/" route and any crawler that doesn't execute JS. Every other
         route gets its own self-referencing canonical/og:url at runtime (src/hooks/useCanonical.js). -->
    <link rel="canonical" href="https://atoopv.com/" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atoopv.com/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Vos PV de CSE, CSSCT et IRP rédigés par des experts des instances représentatives du personnel. — ATOOPV" />
    <meta property="og:description" content="Depuis 2017, AtooPV accompagne les CSE, CSSCT et IRP dans la rédaction de leurs procès-verbaux. Nos experts interviennent en présentiel ou à distance pour produire des PV conformes, précis et opposables." />
    <meta property="og:image" content="https://atoopv.com/atoopv-media/services-hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vos PV de CSE, CSSCT et IRP rédigés par des experts des instances représentatives du personnel. — ATOOPV" />
    <meta name="twitter:description" content="Depuis 2017, AtooPV accompagne les CSE, CSSCT et IRP dans la rédaction de leurs procès-verbaux. Nos experts interviennent en présentiel ou à distance pour produire des PV conformes, précis et opposables." />
    <meta name="twitter:image" content="https://atoopv.com/atoopv-media/services-hero.jpg" />

    <title>Vos PV de CSE, CSSCT et IRP rédigés par des experts des instances représentatives du personnel. — ATOOPV</title>

    <!-- Fonts loaded non-render-blocking (swap avoids FOIT). Preconnect first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@500,700&display=swap"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@500,700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
