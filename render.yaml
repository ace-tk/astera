# Render blueprint for the Astera API.
# Database lives on MongoDB Atlas; set MONGODB_URI + CLIENT_URL in the dashboard.
services:
  - type: web
    name: astera-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render; the app binds process.env.PORT automatically.
      - key: CLIENT_URL
        sync: false # set to your Vercel frontend URL (CORS + Socket.io pin to it)
      - key: MONGODB_URI
        sync: false # MongoDB Atlas SRV connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: ADMIN_EMAILS
        sync: false # comma-separated admin emails (optional; leave blank for none)
